# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "TRY003",
    "EM101",
    "EM102",
    "CPY001", # no per-file copyright headers; LICENSE applies
    "PLR0917", # too many positional arguments (also ignored by HA core)
    "TC001", # type-checking import blocks (also ignored by HA core)
    "TC002",
    "TC003",
    "EXE002", # Windows-Dateisysteme (drvfs) melden alle Dateien als ausführbar; Git speichert 100644
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is the normal way to check results in pytest
    "PLR2004", # magic values are fine in test expectations
    "ARG001", # fixtures are often requested only by parameter name
]
