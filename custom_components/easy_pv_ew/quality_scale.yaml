# Stand der Integration gegenüber der HA Integration Quality Scale.
# done = erfüllt, todo = offen, exempt = trifft nicht zu (mit Begründung).
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration provides no actions.
  appropriate-polling:
    status: done
    comment: Cloud data is polled every 60 seconds by one coordinator.
  brands:
    status: exempt
    comment: Custom integration installed via HACS, not part of the brands repository.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The API client is bundled in easy_pv/ instead of a library on PyPI.
  docs-actions:
    status: exempt
    comment: The integration provides no actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events, they only use the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration provides no actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Short cloud outages are bridged for 5 minutes, then entities become unavailable.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Handled by the DataUpdateCoordinator (logged once when lost and once when back).
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover on the local network.
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover on the local network.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations:
    status: done
    comment: Coordinator errors (cannot_connect, auth_failed) are translated.
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No situations that need a repair issue; token expiry uses the reauth flow.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
